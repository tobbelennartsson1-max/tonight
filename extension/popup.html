<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <span class="logo">TONIGHT</span>
        <select id="lang" aria-label="Language"></select>
      </header>

      <form id="join">
        <h1 data-i18n="ext.joinTitle"></h1>
        <label style="margin-top: 12px"><span data-i18n="together.codePh"></span><input id="code" maxlength="6" autocomplete="off" required /></label>
        <label style="margin-top: 10px"><span data-i18n="together.yourName"></span><input id="name" maxlength="32" required /></label>
        <button class="primary" type="submit" style="margin-top: 14px; display: block" data-i18n="together.join"></button>
      </form>

      <section id="joined" hidden>
        <h1 data-i18n="together.room"></h1>
        <div class="room" id="roomCode"></div>
        <p class="ok" id="status"></p>
        <p class="muted" data-i18n="ext.hint"></p>
        <div class="row">
          <button class="ghost" id="leave" data-i18n="together.leave"></button>
        </div>
      </section>

      <div class="row"><a href="options.html" target="_blank" data-i18n="ext.serverUrl"></a></div>
    </main>
    <script src="shared/i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
